<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>枝见 · 桌面界面原型</title><link rel="stylesheet" href="assets/studio.css"></head><body>
<main class="win"><header class="titlebar"><b data-key="AppName"></b><nav id="menubar" aria-label="Menu"></nav><select id="mode" hidden><option value="system"></option><option value="light"></option><option value="dark"></option></select><select id="language" hidden><option value="zh-CN">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en-US">English</option><option value="ja-JP">日本語</option></select><div class="studio-title-controls"><button id="mode-toggle" aria-label="Theme mode">◐</button><div id="palettes" role="group" aria-label="Palette"></div><details id="language-menu"><summary aria-label="Language">文ᴬ</summary><div role="menu" id="language-items"></div></details></div><div class="caption" aria-label="Window controls"><button data-window="minimize" aria-label="Minimize">—</button><button data-window="maximize" aria-label="Maximize / restore">□</button><button data-window="close" aria-label="Close">×</button></div></header>
<div class="body"><aside class="side"><div class="tabs"><button id="files-tab" data-key="FilesTab"></button><button id="outline-tab" class="on" data-key="OutlineTab"></button></div><div id="files" hidden></div><div id="outline"></div><textarea id="markdown" hidden aria-label="Markdown"></textarea><footer class="editor-tools"><span id="editor-label" data-key="OutlineTab"></span><span class="spacer"></span><button id="add" data-title="AddChild">⊞</button><button id="undo" data-title="Undo">↶</button><button id="redo" data-title="Redo">↷</button><button id="editor-mode" data-title="ToggleToMarkdown">M↓</button></footer></aside><div class="splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical"></div><section class="main panel"><div class="tabs centered"><button class="on" data-key="MindMapTitle"></button></div><div class="canvas"><svg viewBox="0 0 900 600" role="tree" aria-label="Mind map"></svg></div></section></div>
<footer class="status panel"><span id="status" data-key="Ready"></span><span id="node-count"></span><span class="spacer"></span><button id="center" data-title="CenterRoot">⊙</button><button id="zoom-out" data-title="ZoomOut">−</button><span id="zoom">100%</span><button id="zoom-in" data-title="ZoomIn">+</button><button id="minimap-toggle" data-title="MiniMap">▧</button></footer><div id="minimap" class="panel" hidden><svg viewBox="0 0 900 600"></svg></div></main>
<input id="open-input" type="file" accept=".md,.markdown,.json" hidden>
<dialog id="about"><header class="dialog-titlebar"><b data-key="AboutWindowTitle"></b><div class="caption"><button data-dialog-window="minimize" aria-label="Minimize">—</button><button data-dialog-window="maximize" aria-label="Maximize / restore">□</button><button id="about-close" aria-label="Close">×</button></div></header><section><h2 data-key="AppName"></h2><p data-key="AboutDescription"></p><dl><dt data-key="AboutVersion"></dt><dd id="about-version"></dd><dt data-key="AboutPlatform"></dt><dd>.NET 10 · Avalonia 12 · Windows / macOS / Linux</dd><dt data-key="AboutCompileTime"></dt><dd id="about-build"></dd><dt data-key="AboutAuthor"></dt><dd data-key="AboutAuthorName"></dd><dt data-key="AboutContact"></dt><dd><a href="https://codewf.com">https://codewf.com</a></dd><dt data-key="AboutRepository"></dt><dd><a href="https://github.com/dotnet9/Zhijian">https://github.com/dotnet9/Zhijian</a></dd><dt data-key="AboutMindViewPackage"></dt><dd><a href="https://www.nuget.org/packages/CodeWF.Avalonia.MindView">CodeWF.Avalonia.MindView</a></dd><dt data-key="AboutCopyright"></dt><dd id="about-copyright"></dd></dl><div class="update"><p id="update-status"></p><progress id="progress" max="100" value="0" hidden></progress><div class="actions"><button id="update-action"></button><button id="update-cancel" data-key="AboutCancel" hidden></button></div></div><p id="prototype-hint"></p></section></dialog>
<script src="assets/resources.js"></script><script src="assets/metadata.js"></script><script src="assets/studio.js"></script></body></html>
