<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>枝见 · 界面原型</title>
<style>
  :root { --bg:#f6f4ef; --panel:#ffffff; --line:#e3ded2; --ink:#3a3833; --dim:#8d887c; --accent:#2f7d5d; }
  * { box-sizing:border-box; margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  body { background:#d9d4c8; padding:28px; display:flex; justify-content:center; }
  .win { width:1060px; height:660px; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 18px 40px rgba(0,0,0,.18); display:flex; flex-direction:column; overflow:hidden; }
  .titlebar { height:38px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:0 12px; }
  .titlebar .logo { width:18px; height:18px; border-radius:5px; background:var(--accent); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; }
  .titlebar b { font-size:13px; }
  .menu { display:flex; gap:2px; margin-left:8px; font-size:12.5px; color:var(--ink); }
  .menu span { padding:4px 9px; border-radius:6px; cursor:default; }
  .menu span:hover { background:#efece3; }
  .titlebar .spacer { flex:1; }
  .titlebar .ghost { width:12px; height:12px; border-radius:50%; background:#e0dbcd; }
  .body { flex:1; display:flex; min-height:0; }
  .side { width:210px; background:var(--panel); border-right:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:8px; }
  .tabs { display:flex; gap:6px; }
  .tabs i { font-style:normal; font-size:12px; padding:4px 10px; border-radius:7px; color:var(--dim); }
  .tabs i.on { background:#e7f2ec; color:var(--accent); font-weight:600; }
  .fileitem { font-size:12.5px; padding:7px 9px; border-radius:8px; color:var(--ink); }
  .fileitem:hover { background:#f3f0e7; }
  .fileitem.on { background:#e7f2ec; color:var(--accent); }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .viewtabs { height:36px; display:flex; align-items:flex-end; gap:4px; padding:0 14px; }
  .viewtabs i { font-style:normal; font-size:12.5px; padding:6px 14px; border-radius:8px 8px 0 0; color:var(--dim); }
  .viewtabs i.on { background:var(--panel); border:1px solid var(--line); border-bottom:none; color:var(--ink); font-weight:600; }
  .canvas { flex:1; margin:0 14px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; position:relative; overflow:hidden; }
  svg { width:100%; height:100%; }
  .node { fill:#ffffff; stroke:var(--accent); stroke-width:1.5; rx:9; }
  .node.root { fill:#e7f2ec; }
  text { font-size:12px; fill:var(--ink); }
  .edge { stroke:#c9c3b4; stroke-width:1.6; fill:none; }
  .status { height:26px; border-top:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 14px; font-size:11px; color:var(--dim); background:var(--panel); }
  .status .ok { color:var(--accent); }
  .menu-panel { position:absolute; top:40px; left:150px; width:230px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.16); padding:6px; display:none; z-index:9; }
  .menu-panel.open { display:block; }
  .menu-panel div { font-size:12.5px; padding:7px 10px; border-radius:7px; display:flex; justify-content:space-between; }
  .menu-panel div:hover { background:#f3f0e7; }
  .menu-panel i { font-style:normal; color:var(--dim); font-size:11px; }
  .sep { height:1px; background:var(--line); margin:5px 8px; }
  .toast { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); background:#333; color:#fff; font-size:12.5px; padding:9px 16px; border-radius:9px; opacity:0; transition:opacity .25s; }
  .toast.show { opacity:.92; }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar">
    <div class="logo">枝</div><b>枝见 Zhijian</b>
    <div class="menu">
      <span id="fileMenuBtn">文件 ▾</span><span>编辑</span><span>视图</span><span>帮助</span>
    </div>
    <div class="spacer"></div><div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>
  </div>
  <div class="menu-panel" id="fileMenu">
    <div>新建脑图 <i>Ctrl+N</i></div><div>打开可编辑文件… <i>Ctrl+O</i></div>
    <div>保存 <i>Ctrl+S</i></div><div class="sep"></div>
    <div id="checkUpdateItem">检查更新</div>
    <div>关于枝见</div>
  </div>
  <div class="body">
    <div class="side">
      <div class="tabs"><i class="on">文件</i><i>大纲</i></div>
      <div class="fileitem on">产品方案脑图</div>
      <div class="fileitem">会议纪要 · 10月</div>
      <div class="fileitem">使用手册.md</div>
    </div>
    <div class="main">
      <div class="viewtabs"><i class="on">脑图</i><i>大纲</i><i>Markdown</i></div>
      <div class="canvas">
        <svg viewBox="0 0 800 440">
          <!-- 一级 → 二级 -->
          <path class="edge" d="M270,220 C340,220 340,120 410,120"/>
          <path class="edge" d="M270,220 C340,220 340,220 410,220"/>
          <path class="edge" d="M270,220 C340,220 340,330 410,330"/>
          <!-- 二级 → 三级 -->
          <path class="edge" d="M540,118 C580,118 570,118 600,118"/>
          <path class="edge" d="M540,220 C580,220 570,220 600,220"/>
          <rect class="node root" x="150" y="196" width="120" height="48" rx="9"/>
          <text x="175" y="225">产品方案</text>
          <rect class="node" x="410" y="96" width="130" height="44" rx="9"/>
          <text x="432" y="123">功能设计</text>
          <rect class="node" x="410" y="198" width="130" height="44" rx="9"/>
          <text x="432" y="225">里程碑</text>
          <rect class="node" x="410" y="308" width="130" height="44" rx="9"/>
          <text x="432" y="335">风险清单</text>
          <rect class="node" x="600" y="96" width="110" height="44" rx="9"/>
          <text x="622" y="123">脑图视图</text>
          <rect class="node" x="600" y="198" width="110" height="44" rx="9"/>
          <text x="618" y="225">v1.0 内测</text>
        </svg>
      </div>
    </div>
  </div>
  <div class="status"><span class="ok">● 已保存</span><span>节点 6 · 层级 3</span><span>自动保存已开启</span></div>
  <div class="toast" id="toast"></div>
</div>
<script>
  var panel = document.getElementById('fileMenu'), toast = document.getElementById('toast');
  document.getElementById('fileMenuBtn').onclick = function(e){ e.stopPropagation(); panel.classList.toggle('open'); };
  document.body.onclick = function(){ panel.classList.remove('open'); };
  function say(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(function(){ toast.classList.remove('show'); }, 2600); }
  document.getElementById('checkUpdateItem').onclick = function(){
    say('正在检查更新…');
    setTimeout(function(){ say('当前已是最新版本 v12.1.0.7'); }, 1200);
  };
</script>
</body>
</html>
