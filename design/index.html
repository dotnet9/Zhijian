    "ProductPlanTemplateMarkdown": "# 产品方案\n把一个产品想法整理成可评审、可拆解、可验收的方案。建议先填备注，再调整脑图结构。\n## 用户与场景\n先判断这个产品为谁解决什么问题，避免一上来堆功能。\n### 目标用户\n写清主用户、决策者和使用频率。示例：内容创作者，每周需要整理 3-5 篇选题。\n### 核心痛点\n用用户语言描述痛点，并补充出现频次、损失和现有替代方案。\n### 关键任务\n列出用户真正想完成的任务，而不是系统菜单。每个任务最好能对应一个明确结果。\n## 目标与指标\n把产品价值转成可观察指标，后续才能判断有没有做成。\n### 产品目标\n描述本版本要改善的核心体验，例如降低首次创建脑图的时间。\n### 成功指标\n建议同时写行为指标和质量指标，例如模板使用率、保存率、导出成功率、反馈满意度。\n### 不做什么\n明确边界能减少范围膨胀。写下本版本暂不处理的高级能力或长尾格式。\n## 核心功能\n把用户任务拆成最小可用闭环，优先保证主路径顺畅。\n### 输入与创建\n说明用户从哪里开始：空白创建、模板、导入文件、粘贴 Markdown。\n### 编辑与组织\n写清节点新增、拖拽、备注、撤销重做等高频编辑能力的优先级。\n### 导入导出\n区分可编辑保存和一次性导出，避免用户误解格式兼容能力。\n## 交互与体验\n体验设计要服务于连续编辑，不要让用户频繁离开画布。\n### 新手引导\n记录首次打开时最该教会用户的三件事，避免把帮助做成说明书搬家。\n### 快捷操作\n列出需要暴露在界面上的高频操作，以及只放在快捷键里的专家操作。\n### 异常状态\n补齐空白、加载、解析失败、未保存关闭、文件丢失等状态文案。\n## 发布计划\n把方案落到版本、验收和风险，方便研发、测试和运营对齐。\n### 版本范围\n写清本次发布包含哪些场景，哪些进入后续版本。\n### 验收标准\n用用户能完成的任务描述验收，例如可用模板生成脑图并保存为 Markdown。\n### 风险与依赖\n记录技术风险、平台限制、第三方依赖和需要提前确认的事项。",

    "MeetingNotesTemplateMarkdown": "# 会议纪要\n用于把会议从聊天记录整理成结论、行动项和后续风险，方便会后同步。\n## 会议目标\n写本次会议必须解决的一个核心问题。目标越明确，纪要越容易收敛。\n## 议题\n会前列议题，会中按议题补充背景、分歧和结论。\n### 议题一\n写议题背景、当前阻塞和需要谁拍板。\n### 议题二\n写备选方案、争议点和判断标准。\n## 关键结论\n只记录已经确认的决定。还没定的内容放到风险与待确认，避免误传。\n## 行动项\n每个行动项都要包含任务、负责人、截止时间和可验收结果。\n### 负责人\n写唯一负责人，不写多人共同负责。协作人可以放在备注里。\n### 截止时间\n写具体日期或下次同步前，避免只写尽快。\n## 风险与待确认\n记录会后可能影响推进的依赖、信息缺口和未达成一致的问题。\n## 下次会议\n写下次同步的时间、目标和需要提前准备的材料。",
    "StudyNotesTemplate": "学习笔记",
    "StudyNotesTemplateDescription": "适合沉淀概念、资料、问题、案例和复盘。",
    "StudyNotesTemplateMarkdown": "# 学习笔记\n把资料整理成自己的知识结构，而不是复制原文。建议每个节点都写一句自己的理解。\n## 核心概念\n先定义最重要的概念，再补充它和相近概念的区别。\n## 资料来源\n记录来源、可信度和适用范围，方便以后回看时判断是否还能用。\n### 文章\n写文章标题、作者、链接或关键词，并标注最有价值的段落。\n### 视频\n记录时间点和关键观点，避免复看时从头找。\n### 书籍\n写章节、页码和一句摘要，适合长期沉淀。\n## 问题清单\n把还没想明白的问题集中放这里，复习时优先处理。\n## 案例与实践\n把概念落到真实例子，最好写一个自己能复现的小练习。\n## 复盘总结\n学习结束后补充，而不是一开始就填满。\n### 我理解了什么\n用自己的话解释核心概念，如果能讲给别人听，说明掌握得更稳。\n### 还需要补什么\n记录薄弱点、下一步资料和计划实践的时间。",

    "ProductPlanTemplateDescription": "適合梳理使用者、目標、功能、體驗和發布計畫。",
    "ProductPlanTemplateMarkdown": "# 產品方案\n把一個產品想法整理成可評審、可拆解、可驗收的方案。建議先填備註，再調整腦圖結構。\n## 使用者與場景\n先判斷這個產品為誰解決什麼問題，避免一開始就堆功能。\n### 目標使用者\n寫清主使用者、決策者和使用頻率。範例：內容創作者，每週需要整理 3-5 篇選題。\n### 核心痛點\n用使用者語言描述痛點，並補充出現頻次、損失和現有替代方案。\n### 關鍵任務\n列出使用者真正想完成的任務，而不是系統選單。每個任務最好能對應一個明確結果。\n## 目標與指標\n把產品價值轉成可觀察指標，後續才能判斷有沒有做成。\n### 產品目標\n描述本版本要改善的核心體驗，例如降低首次建立腦圖的時間。\n### 成功指標\n建議同時寫行為指標和品質指標，例如範本使用率、儲存率、匯出成功率、回饋滿意度。\n### 不做什麼\n明確邊界能減少範圍膨脹。寫下本版本暫不處理的高階能力或長尾格式。\n## 核心功能\n把使用者任務拆成最小可用閉環，優先保證主路徑順暢。\n### 輸入與建立\n說明使用者從哪裡開始：空白建立、範本、匯入文件、貼上 Markdown。\n### 編輯與組織\n寫清節點新增、拖曳、備註、復原重做等高頻編輯能力的優先級。\n### 匯入匯出\n區分可編輯儲存和一次性匯出，避免使用者誤解格式相容能力。\n## 互動與體驗\n體驗設計要服務於連續編輯，不要讓使用者頻繁離開畫布。\n### 新手引導\n記錄首次開啟時最該教會使用者的三件事，避免把幫助做成說明書搬家。\n### 快捷操作\n列出需要暴露在介面上的高頻操作，以及只放在快捷鍵裡的專家操作。\n### 異常狀態\n補齊空白、載入、解析失敗、未儲存關閉、文件遺失等狀態文案。\n## 發布計畫\n把方案落到版本、驗收和風險，方便研發、測試和營運對齊。\n### 版本範圍\n寫清本次發布包含哪些場景，哪些進入後續版本。\n### 驗收標準\n用使用者能完成的任務描述驗收，例如可用範本生成腦圖並儲存為 Markdown。\n### 風險與依賴\n記錄技術風險、平台限制、第三方依賴和需要提前確認的事項。",

    "MeetingNotesTemplateMarkdown": "# 會議紀要\n用於把會議從聊天記錄整理成結論、行動項和後續風險，方便會後同步。\n## 會議目標\n寫本次會議必須解決的一個核心問題。目標越明確，紀要越容易收斂。\n## 議題\n會前列議題，會中按議題補充背景、分歧和結論。\n### 議題一\n寫議題背景、目前阻塞和需要誰拍板。\n### 議題二\n寫備選方案、爭議點和判斷標準。\n## 關鍵結論\n只記錄已經確認的決定。還沒定的內容放到風險與待確認，避免誤傳。\n## 行動項\n每個行動項都要包含任務、負責人、截止時間和可驗收結果。\n### 負責人\n寫唯一負責人，不寫多人共同負責。協作者可以放在備註裡。\n### 截止時間\n寫具體日期或下次同步前，避免只寫盡快。\n## 風險與待確認\n記錄會後可能影響推進的依賴、資訊缺口和未達成一致的問題。\n## 下次會議\n寫下次同步的時間、目標和需要提前準備的材料。",

    "StudyNotesTemplateMarkdown": "# 學習筆記\n把資料整理成自己的知識結構，而不是複製原文。建議每個節點都寫一句自己的理解。\n## 核心概念\n先定義最重要的概念，再補充它和相近概念的區別。\n## 資料來源\n記錄來源、可信度和適用範圍，方便以後回看時判斷是否還能用。\n### 文章\n寫文章標題、作者、連結或關鍵字，並標註最有價值的段落。\n### 影片\n記錄時間點和關鍵觀點，避免重看時從頭找。\n### 書籍\n寫章節、頁碼和一句摘要，適合長期沉澱。\n## 問題清單\n把還沒想明白的問題集中放這裡，複習時優先處理。\n## 案例與實踐\n把概念落到真實例子，最好寫一個自己能復現的小練習。\n## 複盤總結\n學習結束後補充，而不是一開始就填滿。\n### 我理解了什麼\n用自己的話解釋核心概念，如果能講給別人聽，說明掌握得更穩。\n### 還需要補什麼\n記錄薄弱點、下一步資料和計畫實踐的時間。",

    "ProductPlanTemplate": "Product Brief",
    "ProductPlanTemplateDescription": "Useful for mapping users, goals, features, experience, and release plans.",
    "ProductPlanTemplateMarkdown": "# Product Brief\nTurn a product idea into a reviewable, buildable, and testable brief. Fill the notes first, then adjust the mind-map structure.\n## Users and Scenarios\nStart with who this serves and where the need appears before listing features.\n### Target Users\nName the primary user, decision maker, and usage frequency. Example: content creators who plan 3-5 topics each week.\n### Core Pain Points\nUse the user's language. Add frequency, impact, and current workarounds.\n### Key Jobs\nList the real jobs users want done, not system menu names. Each job should lead to a clear outcome.\n## Goals and Metrics\nTranslate product value into observable metrics so the release can be judged later.\n### Product Goals\nDescribe the main experience this version should improve, such as reducing time to first usable mind map.\n### Success Metrics\nInclude behavior and quality metrics, such as template usage, save rate, export success rate, and feedback quality.\n### Non-goals\nWrite the boundaries explicitly to prevent scope creep, especially advanced features or long-tail formats.\n## Core Features\nBreak user jobs into the smallest useful loop and protect the main path first.\n### Capture and Creation\nExplain where users start: blank document, template, imported file, or pasted Markdown.\n### Editing and Organization\nPrioritize frequent editing actions such as adding nodes, drag/drop, notes, undo, and redo.\n### Import and Export\nSeparate editable saving from one-off export so users understand format support.\n## Interaction and Experience\nDesign for continuous editing so users do not keep leaving the canvas.\n### Onboarding\nRecord the three things first-time users must learn instead of turning help into a manual copy.\n### Fast Actions\nList actions that deserve visible controls and expert actions that can live in shortcuts.\n### Error States\nCover blank, loading, parse failure, unsaved close, missing file, and similar states.\n## Release Plan\nBring the brief down to scope, acceptance, and risks so product, engineering, and QA align.\n### Version Scope\nState what this release includes and what moves to later versions.\n### Acceptance Criteria\nDescribe user-completable outcomes, such as creating a mind map from a template and saving it as Markdown.\n### Risks and Dependencies\nTrack technical risks, platform limits, third-party dependencies, and items needing confirmation.",
    "MeetingNotesTemplate": "Meeting Notes",
    "MeetingNotesTemplateDescription": "Useful for agendas, decisions, action items, and follow-up risks.",
    "MeetingNotesTemplateMarkdown": "# Meeting Notes\nTurn discussion into decisions, action items, and follow-up risks for easy sharing after the meeting.\n## Meeting Goal\nWrite the one problem this meeting must solve. A clear goal keeps the notes focused.\n## Agenda\nPrepare topics before the meeting, then add background, disagreements, and outcomes during the meeting.\n### Topic One\nCapture the background, current blocker, and who needs to decide.\n### Topic Two\nCapture options, tradeoffs, and decision criteria.\n## Key Decisions\nOnly write confirmed decisions here. Put unresolved items under risks and open questions.\n## Action Items\nEach action should include task, owner, due date, and the result that proves it is done.\n### Owner\nUse one accountable owner. Collaborators can be mentioned in the note.\n### Due Date\nUse a concrete date or before next sync instead of as soon as possible.\n## Risks and Open Questions\nTrack dependencies, missing information, and disagreements that may affect progress.\n## Next Meeting\nWrite the next sync time, purpose, and materials to prepare.",
    "StudyNotesTemplate": "Study Notes",
    "StudyNotesTemplateDescription": "Useful for capturing concepts, sources, questions, examples, and reflection.",
    "StudyNotesTemplateMarkdown": "# Study Notes\nTurn source material into your own knowledge structure instead of copying text. Add one sentence of personal understanding to each node.\n## Core Concepts\nDefine the most important concepts first, then note how they differ from nearby ideas.\n## Sources\nRecord source, credibility, and applicable context so future-you can judge whether it still applies.\n### Articles\nAdd title, author, link, or keywords, plus the most valuable section.\n### Videos\nCapture timestamps and key points so you do not need to rewatch from the beginning.\n### Books\nRecord chapter, page, and a short summary for long-term reference.\n## Questions\nKeep unresolved questions here and revisit them first during review.\n## Examples and Practice\nConnect concepts to real examples, ideally with a small exercise you can reproduce.\n## Reflection\nFill this after studying, not at the beginning.\n### What I Understand\nExplain the idea in your own words. If you can teach it, you probably understand it.\n### What to Learn Next\nRecord weak spots, next sources, and when you plan to practice.",

    "ProductPlanTemplateDescription": "ユーザー、目標、機能、体験、リリース計画の整理に使えます。",
    "ProductPlanTemplateMarkdown": "# プロダクト概要\nプロダクトのアイデアを、レビュー、開発、検証ができる形に整理します。先にノートを埋めてから構造を調整します。\n## ユーザーとシナリオ\n機能を並べる前に、誰のどんな場面の課題を解くのかを確認します。\n### 対象ユーザー\n主なユーザー、意思決定者、利用頻度を書きます。例：毎週 3-5 件の企画を整理するコンテンツ制作者。\n### 主な課題\nユーザーの言葉で課題を書き、発生頻度、影響、現在の代替手段も補足します。\n### 重要なジョブ\nユーザーが本当に達成したいことを書きます。メニュー名ではなく、結果につながるタスクにします。\n## 目標と指標\nプロダクト価値を観測できる指標に変換し、後で成功を判断できるようにします。\n### プロダクト目標\nこのバージョンで改善したい体験を書きます。例：最初の使えるマインドマップ作成までの時間を短くする。\n### 成功指標\nテンプレート利用率、保存率、エクスポート成功率、フィードバック品質など、行動と品質の指標を入れます。\n### やらないこと\nスコープ拡大を防ぐため、高度な機能や長尾フォーマットなど今回は扱わない範囲を書きます。\n## 主要機能\nユーザーのタスクを最小の有用な流れに分解し、まず主経路を安定させます。\n### 入力と作成\n空白作成、テンプレート、ファイル取り込み、Markdown 貼り付けなど開始地点を書きます。\n### 編集と整理\nノード追加、ドラッグ、ノート、元に戻す、やり直しなど高頻度操作の優先度を書きます。\n### インポートとエクスポート\n編集可能な保存と一回限りのエクスポートを分け、対応形式の誤解を避けます。\n## 操作と体験\nユーザーがキャンバスから離れずに編集を続けられる体験を設計します。\n### オンボーディング\n初回に必ず理解してほしい三つのことを書きます。ヘルプをマニュアルのコピーにしないためです。\n### すばやい操作\n画面に出すべき高頻度操作と、ショートカットだけでよい上級操作を分けます。\n### エラー状態\n空白、読み込み、解析失敗、未保存で閉じる、ファイル消失などの状態文言を補います。\n## リリース計画\nスコープ、受け入れ条件、リスクに落とし、プロダクト、開発、QA の認識を合わせます。\n### バージョン範囲\nこのリリースに含める場面と、後続バージョンへ送るものを書きます。\n### 受け入れ条件\nテンプレートからマインドマップを作成して Markdown として保存できる、などユーザー行動で書きます。\n### リスクと依存関係\n技術リスク、プラットフォーム制限、外部依存、事前確認が必要な事項を記録します。",
    "MeetingNotesTemplate": "会議メモ",
    "MeetingNotesTemplateDescription": "アジェンダ、決定事項、アクション、フォローアップリスクの整理に使えます。",
    "MeetingNotesTemplateMarkdown": "# 会議メモ\n会議の会話を、決定事項、アクション、フォローアップリスクとして共有しやすい形に整理します。\n## 会議の目的\nこの会議で必ず解くべき一つの問題を書きます。目的が明確だとメモが散らかりにくくなります。\n## アジェンダ\n会議前に議題を並べ、会議中に背景、意見の違い、結論を追記します。\n### 議題一\n背景、現在の阻害要因、誰が判断する必要があるかを書きます。\n### 議題二\n選択肢、トレードオフ、判断基準を書きます。\n## 主な決定事項\n確定した決定だけを書きます。未確定の内容はリスクと未確認事項に置きます。\n## アクション項目\n各アクションにはタスク、担当者、期限、完了とみなす結果を入れます。\n### 担当者\n責任者は一人にします。協力者はノートに補足します。\n### 期限\nなるべく早くではなく、具体的な日付または次回同期前と書きます。\n## リスクと未確認事項\n進行に影響する依存、情報不足、合意できていない点を記録します。\n## 次回会議\n次回同期の時間、目的、事前に準備する資料を書きます。",
    "StudyNotesTemplate": "学習ノート",
    "StudyNotesTemplateDescription": "概念、参考資料、疑問、例、振り返りの整理に使えます。",
    "StudyNotesTemplateMarkdown": "# 学習ノート\n資料をそのまま写すのではなく、自分の知識構造に変換します。各ノードに自分の理解を一文で書きます。\n## 重要な概念\nまず最重要概念を定義し、近い概念との違いも補足します。\n## 参考資料\n出典、信頼度、適用範囲を記録し、後で見返したときに使えるか判断できるようにします。\n### 記事\nタイトル、著者、リンク、キーワードと、特に価値のある段落を書きます。\n### 動画\nタイムスタンプと重要な主張を記録し、見返すときに最初から探さなくてよいようにします。\n### 書籍\n章、ページ、一文要約を書き、長期的な参照にします。\n## 疑問リスト\nまだ理解できていない疑問をここに集め、復習時に優先して扱います。\n## 例と実践\n概念を実例に結びつけ、できれば自分で再現できる小さな練習を書きます。\n## 振り返り\n学習後に埋めます。最初から無理に完成させなくて構いません。\n### 理解したこと\n自分の言葉で説明します。人に教えられるなら、かなり理解できています。\n### 次に学ぶこと\n弱い部分、次に読む資料、実践する予定を書きます。",
